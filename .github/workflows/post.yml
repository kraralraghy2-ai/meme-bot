name: meme-bot
on:
  schedule:
    - cron: "0 7,13,19 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python bot.py generate
      - name: Commit image
        run: |
          git config user.name "meme-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "new meme" || true
          git push || true
          sleep 20
      - run: python bot.py publish
      - name: Save post log
        run: |
          git add -A
          git commit -m "log" || true
          git push || true
